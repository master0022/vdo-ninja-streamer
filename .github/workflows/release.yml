name: Windows release

run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for legacy OBS releases
        if: startsWith(env.RELEASE_TAG, 'v0.1.')
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Python build dependencies for legacy OBS releases
        if: startsWith(env.RELEASE_TAG, 'v0.1.')
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller==6.22.0 Pillow websocket-client

      - name: Build tagged portable package
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -like 'v0.2.*') {
            & .\v0.2-gstreamer\build-portable.ps1 -OutputDirectory .\release -ArtifactVersion "$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "RELEASE_ASSET=release\StreamerV2-$env:RELEASE_TAG-win-x64.zip" >> $env:GITHUB_ENV
            "RELEASE_NAME=VDO-Ninja Streamer $env:RELEASE_TAG (GStreamer)" >> $env:GITHUB_ENV
          } else {
            & .\packaging\build-release.ps1 -ArtifactVersion "$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "RELEASE_ASSET=release\streamer-$env:RELEASE_TAG-windows-x64.zip" >> $env:GITHUB_ENV
            "RELEASE_NAME=VDO-Ninja Streamer $env:RELEASE_TAG" >> $env:GITHUB_ENV
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ASSET }}
