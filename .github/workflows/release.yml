name: Windows release

run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller==6.22.0 Pillow websocket-client

      - name: Build portable package
        shell: pwsh
        run: .\packaging\build-release.ps1 -ArtifactVersion "$env:RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VDO-Ninja Streamer ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/streamer-${{ env.RELEASE_TAG }}-windows-x64.zip
